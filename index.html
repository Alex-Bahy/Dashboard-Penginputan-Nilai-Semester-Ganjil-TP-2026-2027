<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#e8edf1;--paper:#fbfcfd;--ink:#0e2238;--ink2:#26405c;--muted:#566779;--line:#c6d1db;
  --hi:#ffd23f;--ok:#0a7551;--wait:#7a4d00;
  --sign:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gutter:clamp(16px,4vw,40px);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{font-family:var(--body);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);min-height:100dvh;-webkit-font-smoothing:antialiased;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
button,input{font:inherit;color:inherit;}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;box-shadow:0 0 0 5px var(--ink);border-radius:6px;}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--gutter);}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 0 16px;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.logo{width:48px;height:48px;display:grid;place-items:center;flex-shrink:0;filter:drop-shadow(2px 2px 0 rgba(14,34,56,.25));}
.logo img{width:48px;height:48px;object-fit:contain;}
.brand b{display:block;font-family:var(--sign);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.15;}
.brand small{font-size:12px;color:var(--muted);}
.nav-r{display:flex;align-items:center;gap:10px;}
.tp{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--hi);border:2px solid var(--ink);white-space:nowrap;}
.home{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;text-decoration:none;transition:background .15s,transform .15s;}
.home:hover{background:var(--ink2);transform:translateX(-2px);}
.home svg{width:16px;height:16px;}

/* HERO */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(20px,4vw,48px);align-items:end;padding:clamp(18px,4vw,40px) 0 clamp(26px,4vw,44px);}
.date{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px;}
h1{font-family:var(--sign);font-stretch:125%;font-weight:900;font-size:clamp(28px,4.6vw,50px);line-height:1.04;letter-spacing:-.03em;margin-bottom:22px;max-width:15em;text-wrap:balance;}
.search{position:relative;max-width:480px;}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted);pointer-events:none;}
.search input{width:100%;height:52px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);padding:0 52px 0 44px;font-size:16px;font-weight:500;box-shadow:4px 4px 0 var(--ink);-webkit-appearance:none;appearance:none;transition:box-shadow .15s,transform .15s;}
.search input::placeholder{color:#8493a4;font-weight:400;}
.search input:focus{outline:none;transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink),0 0 0 4px var(--hi);}
.search kbd{position:absolute;right:13px;top:50%;transform:translateY(-50%);font:700 12px var(--body);color:var(--muted);border:1.5px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--bg);}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;border-radius:8px;background:var(--bg);font-size:20px;line-height:1;color:var(--muted);display:none;}
.search.has-text kbd{display:none;}
.search.has-text .clear{display:block;}

/* STATUS BOARD */
.board{background:var(--ink);color:#fff;border-radius:6px 24px 6px 24px;padding:18px 18px 10px;}
.board-t{font-family:var(--sign);font-stretch:125%;font-weight:800;font-size:13px;margin:0 6px 8px;color:var(--hi);}
.row{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:11px 10px;color:#fff;transition:background .15s;}
.row:hover{background:rgba(255,255,255,.08);}
.row.cur{background:rgba(255,255,255,.14);box-shadow:inset 3px 0 0 var(--hi);}
.row-n{font-family:var(--sign);font-stretch:125%;font-weight:800;font-size:15px;min-width:5.6em;}
.tiles{display:flex;gap:5px;flex-wrap:wrap;}
.tile{width:15px;height:24px;border-radius:3px;background:var(--c);}
.tile.off{background:repeating-linear-gradient(135deg,transparent 0 3px,rgba(255,255,255,.35) 3px 5px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4);}
.intro .tile{animation:grow .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 40ms + 150ms);transform-origin:bottom;}
@keyframes grow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
.row-c{grid-column:2;font-size:12px;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums;}
.row-c b{color:#fff;}

/* STICKY BAR */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);}
.bar-in{display:flex;align-items:center;gap:10px;}
.bar .home{display:none;width:40px;padding:0;justify-content:center;}
.tabs{display:flex;gap:6px;padding:10px 0;overflow-x:auto;flex:1;scrollbar-width:none;}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none;}
.tab{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;min-height:42px;padding:0 18px;border:2px solid transparent;border-radius:8px;background:none;font-family:var(--sign);font-stretch:125%;font-weight:800;font-size:14px;color:var(--muted);transition:background .15s,color .15s;}
.tab:hover{color:var(--ink);background:rgba(14,34,56,.06);}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff;}
.tab .n{font:700 11px var(--body);min-width:22px;padding:1px 6px;border-radius:99px;text-align:center;background:rgba(14,34,56,.12);}
.tab[aria-pressed="true"] .n{background:var(--hi);color:var(--ink);}

/* FILTERS */
.filters{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:20px 0 6px;}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;max-width:100%;}
.chip{white-space:nowrap;min-height:34px;padding:0 14px;border-radius:99px;border:1.5px solid var(--ink2);background:transparent;font-size:13px;font-weight:600;color:var(--ink2);transition:background .15s,color .15s;}
.chip:hover{background:var(--paper);}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--paper);}
.seg button{border:none;background:none;min-height:36px;padding:0 15px;font-size:13px;font-weight:700;color:var(--muted);border-right:2px solid var(--ink);}
.seg button:last-child{border-right:none;}
.seg button[aria-pressed="true"]{background:var(--hi);color:var(--ink);}
.result{font-size:13px;color:var(--muted);padding:8px 0 16px;}

/* RECENT */
.recent{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding-top:20px;}
.recent.show{display:flex;}
.recent span{font-size:13px;font-weight:700;color:var(--ink2);}
.rc{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 13px 0 9px;border-radius:99px;background:var(--paper);border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s;}
.rc:hover{border-color:var(--ink);transform:translateY(-2px);}
.rc i{width:12px;height:12px;border-radius:3px;background:var(--c);}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:20px;padding-bottom:calc(64px + env(safe-area-inset-bottom));}
.card{--c:#1b6fc4;display:flex;flex-direction:column;background:var(--paper);border:2px solid var(--ink);border-radius:6px 20px 6px 20px;overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;}
.card:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--ink);}
.card:active{transform:translate(0,0);box-shadow:none;}
.head{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 16px 18px;background:var(--c);color:#fff;border-bottom:2px solid var(--ink);}
.card.is-off .head{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,#fff) 0 10px,color-mix(in srgb,var(--c) 7%,#fff) 10px 20px);color:var(--ink);}
.lb{font-family:var(--sign);font-stretch:125%;font-weight:900;font-size:26px;line-height:1;letter-spacing:-.03em;}
.ic{display:block;font-size:20px;line-height:1;margin-bottom:10px;}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--paper);border:1.5px solid var(--ink);flex-shrink:0;}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor;}
.status.on{color:var(--ok);}
.status.on i{animation:pulse 2.2s ease-out infinite;}
.status.off{color:var(--wait);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,117,81,.5);}70%,100%{box-shadow:0 0 0 7px rgba(10,117,81,0);}}
.body{display:flex;flex-direction:column;gap:16px;padding:16px;flex:1;}
.nm{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;flex:1;}
.acts{display:flex;gap:8px;}
.open{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:8px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;text-decoration:none;transition:background .15s;}
.open:hover{background:var(--ink2);}
.open svg{width:16px;height:16px;transition:transform .18s;}
.open:hover svg{transform:translate(2px,-2px);}
.open.disabled{background:var(--bg);color:#7d8c9c;border:1.5px dashed var(--line);pointer-events:none;}
.ib{width:44px;height:44px;border-radius:8px;flex-shrink:0;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;transition:background .15s;}
.ib:hover{background:var(--hi);}
.ib[aria-expanded="true"]{background:var(--hi);}
.ib svg{width:18px;height:18px;}

.edit{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease;margin-top:-16px;}
.card.editing .edit{grid-template-rows:1fr;margin-top:0;}
.edit>form{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .22s;}
.card.editing .edit>form{visibility:visible;transition-delay:0s;}
.edit-in{display:flex;flex-direction:column;gap:9px;padding:12px;background:var(--bg);border-radius:8px;border:1.5px solid var(--line);}
.edit label{font-size:12.5px;font-weight:700;color:var(--ink2);}
.edit-row{display:flex;gap:8px;}
.edit input{flex:1;min-width:0;height:42px;border-radius:8px;border:2px solid var(--ink);background:#fff;padding:0 11px;font-size:16px;}
.edit input:focus{outline:none;box-shadow:0 0 0 3px var(--hi);}
.save{height:42px;padding:0 15px;border:2px solid var(--ink);border-radius:8px;background:var(--hi);font-weight:700;font-size:13px;}
.edit-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.hint{font-size:12px;color:var(--muted);}
.reset{border:none;background:none;color:#a0233a;font-size:12.5px;font-weight:700;padding:6px 2px;text-decoration:underline;}

.empty{grid-column:1/-1;border:2px dashed var(--ink2);border-radius:6px 20px 6px 20px;padding:44px 22px;text-align:center;}
.empty h3{font-family:var(--sign);font-stretch:125%;font-weight:800;font-size:20px;margin-bottom:6px;}
.empty p{color:var(--muted);max-width:420px;margin:0 auto 18px;}
.empty button{border:2px solid var(--ink);background:var(--hi);font-weight:700;padding:10px 20px;border-radius:8px;}

#toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,24px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;border-left:5px solid var(--hi);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99;max-width:calc(100vw - 32px);}
#toast.show{opacity:1;transform:translate(-50%,0);}

footer{background:var(--ink);color:rgba(255,255,255,.65);font-size:13px;padding:30px var(--gutter) calc(30px + env(safe-area-inset-bottom));text-align:center;line-height:1.8;}
footer b{color:#fff;font-family:var(--sign);font-stretch:125%;}
footer a{color:var(--hi);font-weight:600;}
footer small{display:block;font-size:12px;opacity:.8;}

@media(max-width:900px){.hero{grid-template-columns:1fr;}}
@media(max-width:640px){
  body{font-size:14px;}
  .tp,.nav .home span{display:none;}
  .nav .home{display:none;}
  .bar .home{display:inline-flex;}
  .search kbd{display:none;}
  .filters{flex-direction:column;align-items:stretch;}
  .seg{display:flex;}.seg button{flex:1;}
  .brand small{display:none;}
}
@media(hover:none){.card:hover{transform:none;box-shadow:none;}.home:hover,.rc:hover{transform:none;}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}}
</style>

<script>
/* ═══ DATA ═══ */
const JURUSAN = {
  mplb:{short:'MPLB', name:'Manajemen Perkantoran dan Layanan Bisnis',   icon:'🏢', c:'#1B62B8'},
  akl: {short:'AKL',  name:'Akuntansi dan Keuangan Lembaga',             icon:'📊', c:'#8F6200'},
  pms: {short:'PMS',  name:'Pemasaran',                                   icon:'🛍️', c:'#0B7A60'},
  ulp: {short:'ULP',  name:'Usaha Layanan Pariwisata',                    icon:'✈️', c:'#B5304A'},
  tjkt:{short:'TJKT', name:'Teknik Jaringan Komputer dan Telekomunikasi', icon:'🌐', c:'#6B3FA0'},
  tk:  {short:'TK',   name:'Teknik Ketenagalistrikan',                    icon:'⚡', c:'#A9490C'}
};
const LEVELS = {
  x:  {label:'Kelas X',   roman:'X'},
  xi: {label:'Kelas XI',  roman:'XI'},
  xii:{label:'Kelas XII', roman:'XII'}
};
/* [jurusan, nomor rombel (opsional)] */
const ROSTER = {
  x:  [['mplb'],['akl'],['pms'],['ulp'],['tjkt',1],['tjkt',2],['tk',1],['tk',2]],
  xi: [['mplb'],['akl'],['pms'],['ulp'],['tjkt',1],['tjkt',2],['tk',1],['tk',2]],
  xii:[['mplb'],['akl'],['pms'],['ulp'],['tjkt',1],['tjkt',2],['tk']]
};
const CLASSES = [];
Object.keys(ROSTER).forEach(level => {
  ROSTER[level].forEach(([jur, n]) => {
    const j = JURUSAN[jur];
    CLASSES.push({
      id: level + '-' + jur + (n || ''),
      level, jur,
      label: LEVELS[level].roman + ' ' + j.short + (n ? ' ' + n : ''),
      name: j.name + (n ? ' ' + n : ''),
      short: j.short
    });
  });
});

/* ═══ LINK DEFAULT TP 2026/2027 ═══
   Tambah atau ubah link baru di objek ini. Kelas tanpa link tampil sebagai "Menyusul". */
const DEFAULT_LINKS = {
  /* Kelas X */
  'x-mplb' : 'https://alex-bahy.github.io/Portal-Kelas-XMPLB-TP-2026-2027/',
  'x-akl'  : 'https://alex-bahy.github.io/Portal-Kelas-XAKL-TP-2026-2027/',
  'x-pms'  : 'https://alex-bahy.github.io/Portal-Kelas-XPMS-TP-2026-2027/',
  'x-ulp'  : 'https://alex-bahy.github.io/Portal-Kelas-XULP-TP-2026-2027/',
  'x-tjkt1': 'https://alex-bahy.github.io/Portal-Kelas-XTJKT1-ganjil-TP-2026-2027/',
  'x-tjkt2': 'https://alex-bahy.github.io/Portal-Kelas-XTJKT2-TP-2026-2027/',
  'x-tk1'  : 'https://alex-bahy.github.io/Portal-Kelas-XTK1-TP-2026-2027/',
  'x-tk2'  : 'https://alex-bahy.github.io/Portal-Kelas-XTK2-ganjil-TP-2026-2027/',

  /* Kelas XI */
  'xi-mplb' : 'https://alex-bahy.github.io/Portal-Kelas-XI-MPLB-2026-2027/',
  'xi-akl'  : 'https://alex-bahy.github.io/Portal-XIAKL-TP-2026-2027/',
  'xi-pms'  : 'https://alex-bahy.github.io/Portal-Kelas-XIPMS-TP-2026-2027/',
  'xi-ulp'  : 'https://alex-bahy.github.io/Portal-Kelas-XIULP-TP-2026-2027/',
  'xi-tjkt1': 'https://alex-bahy.github.io/Portal-Kelas-XITJKT1-TP-2026-2027-new/',
  'xi-tjkt2': 'https://alex-bahy.github.io/Portal-Kelas-XITJKT2-ganjil-TP-2026-2027/',
  'xi-tk1'  : 'https://alex-bahy.github.io/Portal-Kelas-XITK1-ganjil-TP-2026-2027/',
  'xi-tk2'  : 'https://alex-bahy.github.io/Portal-Kelas-XITK2-TP-2026-2027/',

  /* Kelas XII */
  'xii-mplb': 'https://alex-bahy.github.io/Portal-Kelas-XIIMPLB-ganjil-genap-TP-2026-2027/',
  'xii-akl' : 'https://alex-bahy.github.io/Portal-Kelas-XIIAKL-ganjil-genap-TP-2026-2027/'
  /* menyusul: xii-pms, xii-ulp, xii-tjkt1, xii-tjkt2, xii-tk */
};

/* Key tetap v3 agar link yang sudah diedit di browser tidak hilang. */
const STORAGE_KEY = 'smk_portal_links_v3';
const TAB_KEY = 'smk_portal_tab';
const RECENT_KEY = 'smk_portal_recent';

function loadLinks(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }catch(e){ return {}; } }
function saveLinks(d){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){} }
function resolveUrl(id){
  const saved = loadLinks()[id];
  if(saved && saved.trim() !== '') return saved.trim();
  return DEFAULT_LINKS[id] || '';
}
function loadRecent(){ try{ const r = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); return Array.isArray(r) ? r : []; }catch(e){ return []; } }
function pushRecent(id){
  const r = [id].concat(loadRecent().filter(x => x !== id)).slice(0, 4);
  try{ localStorage.setItem(RECENT_KEY, JSON.stringify(r)); }catch(e){}
}

/* ═══ HELPERS ═══ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => s.toLowerCase().replace(/\s+/g,'');
const state = { level:'x', q:'', jur:'all', status:'all' };
let first = true;

try{
  const h = location.hash.replace('#','');
  const s = localStorage.getItem(TAB_KEY);
  if(LEVELS[h]) state.level = h; else if(LEVELS[s]) state.level = s;
}catch(e){}

function matches(c){
  const q = norm(state.q);
  if(q && !norm(c.label + c.name + c.short).includes(q)) return false;
  if(state.jur !== 'all' && c.jur !== state.jur) return false;
  const on = !!resolveUrl(c.id);
  if(state.status === 'on' && !on) return false;
  if(state.status === 'off' && on) return false;
  return true;
}

/* ═══ RENDER ═══ */
const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';

function renderCard(c){
  const j = JURUSAN[c.jur];
  const url = resolveUrl(c.id);
  const on = !!url;
  const hasDefault = !!DEFAULT_LINKS[c.id];
  return `
  <article class="card ${on ? 'is-on' : 'is-off'}" data-id="${c.id}" style="--c:${j.c}">
    <div class="head">
      <div><span class="ic" aria-hidden="true">${j.icon}</span><h3 class="lb">${esc(c.label)}</h3></div>
      <span class="status ${on ? 'on' : 'off'}"><i></i>${on ? 'Aktif' : 'Menyusul'}</span>
    </div>
    <div class="body">
      <p class="nm">${esc(c.name)}</p>
      <div class="acts">
        ${on
          ? `<a class="open" href="${esc(url)}" target="_blank" rel="noopener">Buka portal ${ICON_OUT}</a>
             <button type="button" class="ib" data-action="copy" title="Salin link" aria-label="Salin link portal ${esc(c.label)}">${ICON_COPY}</button>`
          : `<span class="open disabled" aria-disabled="true">Belum tersedia</span>`}
        <button type="button" class="ib" data-action="edit" title="${on ? 'Ubah link' : 'Tambah link'}" aria-label="${on ? 'Ubah' : 'Tambah'} link portal ${esc(c.label)}" aria-expanded="false">${ICON_EDIT}</button>
      </div>
      <div class="edit">
        <form data-id="${c.id}" novalidate>
          <div class="edit-in">
            <label for="inp-${c.id}">Link portal ${esc(c.label)}</label>
            <div class="edit-row">
              <input type="url" id="inp-${c.id}" placeholder="https://username.github.io/nama-portal/" value="${esc(url)}">
              <button type="submit" class="save">Simpan</button>
            </div>
            <div class="edit-foot">
              <span class="hint">Enter untuk menyimpan, Esc untuk menutup.</span>
              <button type="button" class="reset" data-action="reset">${hasDefault ? 'Kembalikan bawaan' : 'Hapus link'}</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </article>`;
}

function renderTabs(){
  $('#tabs').innerHTML = Object.keys(LEVELS).map(k => {
    const n = CLASSES.filter(c => c.level === k && matches(c)).length;
    return `<button type="button" class="tab" data-level="${k}" aria-pressed="${state.level === k}">${LEVELS[k].label}<span class="n">${n}</span></button>`;
  }).join('');
}

function renderProgress(){
  let i = 0;
  $('#progress').innerHTML = '<div class="board-t">Kesiapan portal</div>' +
    Object.keys(LEVELS).map(k => {
      const all = CLASSES.filter(c => c.level === k);
      const act = all.filter(c => resolveUrl(c.id)).length;
      const tiles = all.map(c => `<span class="tile ${resolveUrl(c.id) ? '' : 'off'}" style="--c:${JURUSAN[c.jur].c};--i:${i++}" title="${esc(c.label)}"></span>`).join('');
      return `
      <button type="button" class="row ${state.level === k ? 'cur' : ''}" data-level="${k}" aria-label="${LEVELS[k].label}: ${act} dari ${all.length} portal aktif">
        <span class="row-n">${LEVELS[k].label}</span>
        <span class="tiles">${tiles}</span>
        <span class="row-c"><b>${act}</b> dari ${all.length} portal aktif</span>
      </button>`;
    }).join('');
  if(!first) $('#progress').classList.remove('intro');
}

function renderChips(){
  const items = [['all','Semua jurusan']].concat(Object.keys(JURUSAN).map(k => [k, JURUSAN[k].short]));
  $('#chips').innerHTML = items.map(([k, t]) =>
    `<button type="button" class="chip" data-jur="${k}" aria-pressed="${state.jur === k}">${t}</button>`).join('');
}

function renderRecent(){
  const box = $('#recent');
  const items = loadRecent().map(id => CLASSES.find(c => c.id === id)).filter(c => c && resolveUrl(c.id));
  box.classList.toggle('show', items.length > 0);
  box.innerHTML = items.length ? '<span>Terakhir dibuka</span>' + items.map(c =>
    `<a class="rc" data-id="${c.id}" style="--c:${JURUSAN[c.jur].c}" href="${esc(resolveUrl(c.id))}" target="_blank" rel="noopener"><i></i>${esc(c.label)}</a>`).join('') : '';
}

function render(){
  renderTabs(); renderProgress(); renderChips(); renderRecent();
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.status === state.status));

  const total = CLASSES.filter(c => c.level === state.level).length;
  const list = CLASSES.filter(c => c.level === state.level && matches(c));
  $('#grid').innerHTML = list.length ? list.map(renderCard).join('') : `
    <div class="empty">
      <h3>Tidak ada kelas yang cocok</h3>
      <p>Di ${LEVELS[state.level].label} tidak ada hasil untuk pencarian atau saringan ini. Cek angka pada tab tingkat lain, atau hapus saringan.</p>
      <button type="button" data-action="resetfilters">Hapus pencarian dan saringan</button>
    </div>`;
  $('#result').textContent = `Menampilkan ${list.length} dari ${total} kelas ${LEVELS[state.level].label}`;
  $('#search').classList.toggle('has-text', state.q !== '');
  first = false;
}

function greet(){
  const d = new Date(), h = d.getHours();
  const w = h < 11 ? 'pagi' : h < 15 ? 'siang' : h < 18 ? 'sore' : 'malam';
  $('#greet').textContent = 'Selamat ' + w + '. Portal nilai kelas mana yang Anda cari?';
  $('#date').textContent = d.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

/* ═══ ACTIONS ═══ */
function setLevel(k){
  state.level = k;
  try{ localStorage.setItem(TAB_KEY, k); }catch(e){}
  history.replaceState(null, '', '#' + k);
  render();
}

let toastTimer;
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

function copyText(text){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((res, rej) => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy') ? res() : rej(); }catch(e){ rej(); }
    ta.remove();
  });
}

function closeEditors(except){
  document.querySelectorAll('.card.editing').forEach(card => {
    if(card === except) return;
    card.classList.remove('editing');
    const b = card.querySelector('[data-action="edit"]');
    if(b) b.setAttribute('aria-expanded', 'false');
  });
}

function toggleEdit(card){
  const open = !card.classList.contains('editing');
  closeEditors(card);
  card.classList.toggle('editing', open);
  card.querySelector('[data-action="edit"]').setAttribute('aria-expanded', String(open));
  if(open){
    const inp = card.querySelector('input');
    setTimeout(() => { inp.focus(); inp.select(); }, 60);
  }
}

function saveLink(id, raw){
  let url = raw.trim();
  if(!url){ showToast('Isi link dulu, atau pilih Hapus link.'); return; }
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const links = loadLinks();
  links[id] = url;
  saveLinks(links);
  render();
  showToast('Link disimpan');
}

function resetLink(id){
  const links = loadLinks();
  delete links[id];
  saveLinks(links);
  render();
  showToast(DEFAULT_LINKS[id] ? 'Link dikembalikan ke bawaan' : 'Link dihapus');
}

/* ═══ EVENTS ═══ */
document.addEventListener('click', e => {
  const op = e.target.closest('a.open[href], a.rc');
  if(op){
    const id = op.dataset.id || (op.closest('.card') || {dataset:{}}).dataset.id;
    if(id) pushRecent(id);
    setTimeout(renderRecent, 0);
    return;
  }

  const lv = e.target.closest('[data-level]');
  if(lv){ setLevel(lv.dataset.level); return; }

  const chip = e.target.closest('[data-jur]');
  if(chip){ state.jur = chip.dataset.jur; render(); return; }

  const st = e.target.closest('[data-status]');
  if(st){ state.status = st.dataset.status; render(); return; }

  const act = e.target.closest('[data-action]');
  if(!act) return;
  const card = act.closest('.card');
  const id = card && card.dataset.id;

  if(act.dataset.action === 'edit') toggleEdit(card);
  if(act.dataset.action === 'copy'){
    copyText(resolveUrl(id)).then(() => showToast('Link disalin')).catch(() => showToast('Gagal menyalin. Salin manual dari tombol pensil.'));
  }
  if(act.dataset.action === 'reset') resetLink(id);
  if(act.dataset.action === 'resetfilters'){
    state.q = ''; state.jur = 'all'; state.status = 'all';
    $('#q').value = '';
    render();
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-id]');
  if(!f) return;
  e.preventDefault();
  saveLink(f.dataset.id, f.querySelector('input').value);
});

document.addEventListener('keydown', e => {
  if(e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    e.preventDefault();
    $('#q').focus();
  }
  if(e.key === 'Escape'){
    if(document.activeElement === $('#q') && state.q){ $('#qclear').click(); return; }
    closeEditors(null);
  }
});

$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#qclear').addEventListener('click', () => { state.q = ''; $('#q').value = ''; render(); $('#q').focus(); });

/* ═══ INIT ═══ */
greet();
render();
</script>
</body>
</html>
